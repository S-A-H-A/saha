name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package static files
        env:
          API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        shell: bash
        run: |
          mkdir -p _site
          cp index.html styles.css app.js 404.html .nojekyll _site/
          if [[ -n "${API_BASE_URL}" ]]; then
            ESCAPED_URL=$(printf '%s' "${API_BASE_URL}" | sed 's/\\/\\\\/g; s/"/\\"/g')
            sed -i "s|</head>|  <script>window.__API_BASE_URL__ = \"${ESCAPED_URL}\";</script>\n  </head>|" _site/index.html _site/404.html
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
